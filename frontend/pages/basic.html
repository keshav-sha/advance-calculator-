<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Basic Calculator</title>

    <link rel="stylesheet" href="../css/calculator.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>
    <div id="toast"></div>
<div class="calculator-container">

    <div class="calculator">

        <div class="title">

            <a href="../index.html">

                <i class="fa-solid fa-arrow-left"></i>

            </a>

            <h2>Basic Calculator</h2>

        </div>

        <div class="display">

            <input
                type="text"
                id="display"
                readonly>

        </div>

        <div class="buttons">

            <button onclick="clearDisplay()" class="operator">AC</button>

            <button onclick="deleteLast()" class="operator">⌫</button>

            <button onclick="append('%')" class="operator">%</button>

            <button onclick="append('/')" class="operator">÷</button>

            <button onclick="append('7')">7</button>

            <button onclick="append('8')">8</button>

            <button onclick="append('9')">9</button>

            <button onclick="append('*')" class="operator">×</button>

            <button onclick="append('4')">4</button>

            <button onclick="append('5')">5</button>

            <button onclick="append('6')">6</button>

            <button onclick="append('-')" class="operator">−</button>

            <button onclick="append('1')">1</button>

            <button onclick="append('2')">2</button>

            <button onclick="append('3')">3</button>

            <button onclick="append('+')" class="operator">+</button>

            <button onclick="append('0')" class="zero">0</button>

            <button onclick="append('.')">.</button>

            <button onclick="calculate()" class="equal">=</button>

        </div>
<div class="buttons">

    <button class="memory" onclick="memoryClear()">MC</button>

    <button class="memory" onclick="memoryRecall()">MR</button>

    <button class="memory" onclick="memoryAdd()">M+</button>

    <button class="memory" onclick="memorySubtract()">M-</button>

    <button class="scientific" onclick="square()">x²</button>

    <button class="scientific" onclick="cube()">x³</button>

    <button class="scientific" onclick="sqrt()">√x</button>

    <button class="scientific" onclick="power()">xʸ</button>

    <button class="scientific" onclick="percentage()">%</button>

</div>
<div class="history-panel">

    <div class="history-header">

        <h3>Calculation History</h3>

        <button onclick="clearHistory()">
            Clear
        </button>

    </div>

    <div id="historyList">

        <p>No calculations yet.</p>

    </div>

</div>
    </div>

</div>

<script src="../js/basic.js"></script>

</body>

</html>
