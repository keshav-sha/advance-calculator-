<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Financial Calculator</title>

<link rel="stylesheet"
href="../css/finance.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
rel="stylesheet">

</head>

<body>

<div class="container">

<header>

<h1>

<i class="fa-solid fa-money-bill-trend-up"></i>

Financial Calculator

</h1>

<a href="../index.html">

<i class="fa-solid fa-house"></i>

Dashboard

</a>

</header>

<div class="card">

<div class="input-group">

<label>Calculator Type</label>

<select id="calculatorType">

<option value="simple_interest">Simple Interest</option>

<option value="compound_interest">Compound Interest</option>

<option value="emi">EMI Calculator</option>

<option value="loan">Loan Calculator</option>

<option value="sip">SIP Calculator</option>

<option value="fd">Fixed Deposit</option>

<option value="roi">ROI Calculator</option>

<option value="cagr">CAGR Calculator</option>

</select>

</div>

<div class="input-group">

<label>Principal Amount</label>

<input
type="number"
id="principal"
placeholder="Enter Principal">

</div>

<div class="input-group">

<label>Interest Rate (%)</label>

<input
type="number"
id="rate"
placeholder="Enter Interest Rate">

</div>

<div class="input-group">

<label>Time (Years)</label>

<input
type="number"
id="time"
placeholder="Enter Time">

</div>

<div class="input-group">

<label>Monthly Investment (For SIP)</label>

<input
type="number"
id="monthlyInvestment"
placeholder="Enter Monthly Investment">

</div>

<button onclick="calculateFinance()">

<i class="fa-solid fa-calculator"></i>

Calculate

</button>

</div>

<div class="result">

<h2>

Calculation Result

</h2>

<div id="resultBox">

Waiting for Calculation...

</div>

</div>

</div>

<script src="../js/finance.js"></script>

</body>

</html>
